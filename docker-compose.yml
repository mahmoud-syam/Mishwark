version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: mishwarak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mishwarak
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mishwarak-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mishwarak-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: test@test.com
      PGADMIN_DEFAULT_PASSWORD: test123
    ports:
      - "5435:80"
    networks:
      - mishwarak-network



volumes:
  postgres_data:
      driver: local

networks:
  mishwarak-network:
    driver: bridge



