# Builds the production image and runs the server stack (deploy/) exactly as the
# real server does, on ARM (Oracle Cloud's Ampere) and on x86: first start,
# migrations, the Super Admin's first sign-in step, the dashboard, a backup, a
# restore and a restart. The server's update.sh only deploys commits whose
# checks passed, so this job also guards production.
name: Server

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: stack (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Settings like setup.sh writes them
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          mkdir -p backups secrets

      - name: Build the image
        run: APP_VERSION="${GITHUB_SHA::7}" docker compose build api

      - name: First start (migrations run on start)
        run: |
          docker compose up -d db api
          for i in $(seq 1 60); do
            v=$(curl -fsS -m 5 http://127.0.0.1:5000/api/v1/health | jq -r 'select(.ok) | .version' 2>/dev/null || true)
            [ "$v" = "${GITHUB_SHA::7}" ] && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:5000/api/v1/health | tee /dev/stderr | jq -e --arg v "${GITHUB_SHA::7}" '.ok and .version == $v'
          docker compose logs api | grep -E "Applied [0-9]+ migration"

      - name: Super Admin and first sign-in step
        run: |
          out=$(docker compose exec -T -e ADMIN_EMAIL=owner@example.com -e ADMIN_NAME="Owner" -e ADMIN_PHONE=+201001234567 \
            api npx tsx prisma/seed/production.ts)
          pass=$(printf '%s\n' "$out" | sed -n 's/^  Temporary password: //p')
          [ -n "$pass" ] || { echo "$out"; exit 1; }
          echo "::add-mask::$pass"
          # Second run creates nothing.
          docker compose exec -T -e ADMIN_EMAIL=x@example.com -e ADMIN_NAME=X api npx tsx prisma/seed/production.ts | grep -q "already exists"
          # The temporary password works and leads to "choose a new password".
          curl -fsS -X POST http://127.0.0.1:5000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$pass\"}" | jq -e '.passwordChangeRequired == true'
          # No test accounts with known passwords on a production database.
          [ "$(docker compose exec -T db psql -U mishwark -d mishwark -Atc 'SELECT count(*) FROM "Users"')" = "1" ]

      - name: Dashboard and production headers
        run: |
          curl -fsS -o /dev/null -w "dashboard %{http_code}\n" http://127.0.0.1:5000/dashboard/
          curl -fsSI http://127.0.0.1:5000/api/v1/health | grep -i "strict-transport-security\|x-content-type-options"

      - name: Backup
        run: |
          docker compose run --rm -T backup now
          ls -l backups
          db=$(ls backups/db-*.dump | head -1)
          docker compose exec -T db pg_restore --list < "$db" | grep -q 'TABLE public "Users"'
          tar -tzf $(ls backups/files-*.tar.gz | head -1) | grep -q '^storage/'

      - name: Restore (and the safety backup it takes first)
        run: |
          docker compose exec -T db psql -U mishwark -d mishwark -qc "UPDATE \"Users\" SET name = 'changed'"
          db=$(ls -t backups/db-*.dump | tail -1)
          echo yes | sudo ./restore.sh "$(basename "$db")"
          [ "$(docker compose exec -T db psql -U mishwark -d mishwark -Atc 'SELECT name FROM "Users"')" = "Owner" ]
          for i in $(seq 1 40); do curl -fsS -m 5 http://127.0.0.1:5000/api/v1/health | jq -e .ok >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS http://127.0.0.1:5000/api/v1/health | jq -e .ok

      - name: Restart keeps data and applies nothing twice
        run: |
          docker compose restart api
          for i in $(seq 1 40); do curl -fsS -m 5 http://127.0.0.1:5000/api/v1/health | jq -e .ok >/dev/null 2>&1 && break; sleep 3; done
          docker compose logs --since 2m api | grep -q "Database is up to date"
          [ "$(docker compose exec -T db psql -U mishwark -d mishwark -Atc 'SELECT count(*) FROM "Users"')" = "1" ]

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
